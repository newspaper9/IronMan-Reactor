<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="round" style="border: 2px solid #03add0; --round-size: 360px; --round-period: 30s"></div>
    <div class="round" style="border: 25px dashed #03add0; --round-size: 330px; --round-period: 20s"></div>
    <div class="round" style="border: 1px solid #03add0; --round-size: 300px; --round-period: 25s"></div>
    <div class="round" style="border: 12px dashed #03add0; --round-size: 260px; --round-period: 15s; animation-direction: reverse"></div>
    <div class="round" style="border: 8px dashed #03add0; --round-size: 220px; --round-period: 10s"></div>
    <div class="round" style="--round-size: 170px; --round-period: 4s; background-color: #e1f1f4"></div>
  </body>
</html>
